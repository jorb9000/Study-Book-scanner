<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Boekscanner · camera</title>
  <link rel="icon" href="icons/icon-192.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #f3f1ec; overflow: hidden;
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
    [hidden] { display: none !important; }
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s; }
    #flash.on { opacity: .7; transition: none; }
    #dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 1s; }
    #dim.on { opacity: .94; }
    .status { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 14px; display: flex; gap: 8px; align-items: center;
      padding: 6px 12px 6px 10px; border-radius: 99px; background: rgba(0,0,0,.55); font-size: 14px; color: #cfcac0; }
    .status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #888; }
    .status.ok::before { background: #4cc27a; }
    .status.wait::before { background: #e2b04a; }
    .status.bad::before { background: #e06a5a; }
    .screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 32px; text-align: center; background: #000; }
    .screen div { max-width: 360px; display: grid; gap: 12px; }
    .screen h1 { margin: 0; font-size: 24px; }
    .screen p { margin: 0; color: #a7a39a; }
    .go { width: 96px; height: 96px; border-radius: 50%; border: 4px solid #777; background: #fff; margin: 8px auto 0; }
    .app-version { position: fixed; right: 8px; bottom: max(4px, env(safe-area-inset-bottom)); font-size: 12px; color: #9a968e; pointer-events: none; z-index: 30; }
  </style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <div id="flash"></div>
  <div id="dim"></div>
  <div id="status" class="status wait"><span id="status-text">start</span></div>

  <section id="tap" class="screen" role="button" aria-label="Camera starten">
    <div>
      <h1>Camera voor je computer</h1>
      <p id="tap-text">Tik om te beginnen en leg de telefoon daarna liggend op de lamp. Verder bedien je alles op je computer.</p>
      <span class="go" aria-hidden="true"></span>
    </div>
  </section>

  <section id="nocode" class="screen" hidden>
    <div>
      <h1>Koppel met je computer</h1>
      <p>Open de Boekscanner op je computer, kies een boek en klik op <strong>Scannen met de lamp</strong>. Scan de QR-code met de Camera-app van deze iPhone.</p>
    </div>
  </section>

  <div id="app-version" class="app-version" aria-hidden="true"></div>
  <script src="version.js"></script>
  <script src="vendor/peerjs/peerjs.min.js"></script>
  <script type="module" src="lamp.js"></script>
</body>
</html>
